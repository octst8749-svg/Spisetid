<style>
/* Layout: sticky header, week strip of seven day tiles, cards for the days that are planned, bottom tab bar, bottom sheet for picking a dish. */
:root{
  --bg:#F3F7F2; --surface:#FFFFFF; --ink:#1B2A28; --muted:#586F6A; --line:#DBE5DF;
  --accent:#1D7967; --on-accent:#FFFFFF; --accent-soft:#DCF0E8;
  --sun:#E9A820; --sun-soft:#FFF0C8; --sun-ink:#7A5300;
  --berry:#CF3F55; --berry-soft:#FBE2E6; --star-off:#CBD8D2;
  --t0:#FFE2D5; --t1:#FFF0C8; --t2:#DCF0E8; --t3:#DAEAFA; --t4:#EADCF4;
  --on-berry:#FFFFFF;
  --good:#2E7D32; --good-soft:#E0F2E1; --okay:#8A5E00; --okay-soft:#FFF0C8; --treat:#B14D24; --treat-soft:#FFE2D5;
  --shadow:0 1px 2px rgba(20,40,35,.06),0 4px 14px rgba(20,40,35,.07);
  --f-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1716; --surface:#172220; --ink:#E8F1EE; --muted:#9BB3AD; --line:#27403B;
    --accent:#4FC7AC; --on-accent:#06211B; --accent-soft:#17382F;
    --sun:#F4C45C; --sun-soft:#3A3014; --sun-ink:#F4C45C;
    --berry:#F0788A; --berry-soft:#3A1D24; --star-off:#3A524C;
    --t0:#3B2319; --t1:#3A3014; --t2:#17382F; --t3:#17303F; --t4:#2D2240;
    --on-berry:#2B0A10;
    --good:#7BD389; --good-soft:#1B3A22; --okay:#F4C45C; --okay-soft:#3A3014; --treat:#F0A27A; --treat-soft:#3B2319;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1716; --surface:#172220; --ink:#E8F1EE; --muted:#9BB3AD; --line:#27403B;
  --accent:#4FC7AC; --on-accent:#06211B; --accent-soft:#17382F;
  --sun:#F4C45C; --sun-soft:#3A3014; --sun-ink:#F4C45C;
  --berry:#F0788A; --berry-soft:#3A1D24; --star-off:#3A524C;
  --t0:#3B2319; --t1:#3A3014; --t2:#17382F; --t3:#17303F; --t4:#2D2240;
    --on-berry:#2B0A10;
    --good:#7BD389; --good-soft:#1B3A22; --okay:#F4C45C; --okay-soft:#3A3014; --treat:#F0A27A; --treat-soft:#3B2319;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:620px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 112px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font:600 28px/1 var(--f-display);color:var(--accent);letter-spacing:-.01em}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.warn{background:var(--sun-soft);color:var(--sun-ink)}
.people{display:flex;align-items:center;gap:10px;margin-block:4px 14px;color:var(--muted);font-weight:600}
.people b{font:600 20px var(--f-display);color:var(--ink);min-width:1.5ch;text-align:center;font-variant-numeric:tabular-nums}
.rbtn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px;font-weight:700;line-height:1}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.weeknav h2{font:600 18px var(--f-display);text-align:center;flex:1;min-width:0}
.weeknav small{display:block;font:600 13px var(--f-body);color:var(--muted)}
.hint{font-size:14px;color:var(--muted);margin-bottom:8px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:8px 0 4px;display:grid;justify-items:center;gap:1px;min-height:78px;text-align:center}
.day .dw{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.day .dn{font:600 21px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.day .de{font-size:19px;height:24px;line-height:24px;color:var(--accent);font-weight:800}
.day.on{background:var(--accent-soft);border-color:var(--accent)}
.day.today{box-shadow:0 0 0 2px var(--sun)}
.day.past{opacity:.45}
.empty-box{margin-top:18px;background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:18px}
.empty-box h3{font:600 18px var(--f-display);margin-bottom:8px}
.empty-box ol{margin:0;padding-left:22px;display:grid;gap:6px}
.empty{color:var(--muted);padding:14px 2px}
.card{margin-top:14px;background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);scroll-margin-top:90px}
.chead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.chead h3{font:600 18px var(--f-display)}
.link{font-size:13px;color:var(--muted);text-decoration:underline;padding:6px 0 6px 8px}
.tile{width:56px;height:56px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:30px}
.tile.sm{width:44px;height:44px;border-radius:13px;font-size:24px}
.t0{background:var(--t0)}.t1{background:var(--t1)}.t2{background:var(--t2)}.t3{background:var(--t3)}.t4{background:var(--t4)}
.dishline{display:flex;gap:12px;align-items:center}
.dishline h4{margin:0;font:600 19px/1.25 var(--f-display)}
.meta{font-size:13px;color:var(--muted)}
.shared{font-size:13px;font-weight:700;color:var(--accent);display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{min-height:44px;padding:10px 16px;border-radius:14px;font-weight:800;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.sugtitle{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 8px}
.drow{width:100%;display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.card .drow{background:var(--bg)}
.drow:disabled{opacity:.5}
.dmain{min-width:0;flex:1;display:block}
.dname{display:block;font-weight:800;line-height:1.25}
.dmeta{display:block;font-size:13px;color:var(--muted)}
.ings{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;font-size:12px;font-weight:800;padding:1px 8px;border-radius:999px;margin-left:6px;background:var(--accent-soft);color:var(--accent)}
.rpre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;margin:6px 0 0}
.needs{display:block;margin-top:6px;padding:6px 10px;border-radius:10px;background:var(--sun-soft);color:var(--sun-ink);font-size:13px;font-weight:700}
.chosen{display:block;margin-top:6px;padding:6px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700}
.side{display:block;margin-top:5px;font-size:13px;font-weight:700;color:var(--accent)}
.badge.no{background:var(--berry-soft);color:var(--berry)}
.rate{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.rate .lbl{font-size:13px;font-weight:700;color:var(--muted)}
.stars{display:inline-flex}
.st{width:40px;height:40px;font-size:27px;line-height:1;color:var(--star-off);display:grid;place-items:center}
.st.on{color:var(--sun)}
.fam{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sumbar{background:var(--accent-soft);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-weight:700}
.sumbar span{display:block;font-weight:600;font-size:14px;color:var(--muted)}
.group{margin-top:16px}
.group h3{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 4px;border-bottom:1px solid var(--line)}
.cb{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;color:var(--on-accent);font-weight:800;font-size:16px}
.item.done .cb{background:var(--accent)}
.item.done .iname{text-decoration:line-through;color:var(--muted)}
.iname{display:block;font-weight:700}
.icap{display:block;font-size:12.5px;color:var(--muted)}
.icap em{font-style:normal;font-weight:800;color:var(--accent);margin-right:4px}
.qty{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.item.done .qty{color:var(--muted);font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs div{max-width:620px;margin-inline:auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:700;color:var(--muted);position:relative}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab .cnt{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--berry);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.back{position:fixed;inset:0;background:rgba(8,20,18,.5);z-index:20}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:640px;margin-inline:auto;max-height:88%;display:flex;flex-direction:column;background:var(--bg);border-radius:22px 22px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.phead h2{font:600 19px var(--f-display)}
.x{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:16px}
.search{width:100%;font:16px var(--f-body);padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);margin-bottom:10px}
.slist{overflow-y:auto;flex:1;min-height:0}
.panel.tall{top:7%;bottom:auto;height:81%;max-height:none;border-radius:22px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.fact,.hl{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:2px 9px 2px 7px;border-radius:999px;white-space:nowrap}
.fact{border:1px solid var(--line);color:var(--muted)}
.hl.h3{background:var(--good-soft);color:var(--good)}
.hl.h2{background:var(--okay-soft);color:var(--okay)}
.hl.h1{background:var(--treat-soft);color:var(--treat)}
.ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hl .ic{opacity:.35}
.hl .ic.on{opacity:1;fill:currentColor}
.hl .ic:first-child{margin-left:0}
.btn.danger{background:var(--berry);color:var(--on-berry)}
.confirm{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--berry-soft);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-weight:700}
.confirm .btn{min-height:40px;padding:8px 14px}
.addform{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.addform .search{margin:0;flex:1 1 170px;min-width:0}
.addform .qtyin{flex:0 1 96px}
.nwrap{position:relative;flex:1 0 100%}
.nwrap .search{width:100%}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:6;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:0 0 0 1.5px var(--line),0 8px 20px rgba(0,0,0,.18)}
.sugg:empty{display:none}
.sugg button{text-align:left;font:16px var(--f-body);color:var(--ink);background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;min-height:44px;cursor:pointer}
.sugg button:first-child{border-top:0}
.group.alldone h3{opacity:.55}
.sugg button{display:flex;justify-content:space-between;gap:12px;align-items:center}
.sugg small{color:#6b7a76;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.crow{padding:0;gap:4px}
.crow-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:10px 4px}
.x.sm{width:36px;height:36px;font-size:14px;flex:none}
.drow.snack{align-items:flex-start}
.drow.picked{border-color:var(--accent);background:var(--accent-soft)}
.card .drow.picked{background:var(--accent-soft)}
.rh{font:600 17px var(--f-display);margin:16px 0 8px}
.ingl{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;border:1px solid var(--line)}
.ingl li{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line)}
.ingl li:last-child{border-bottom:0}
.ingl .qty{font-weight:800}
.steps{margin:0;padding-left:24px;display:grid;gap:10px}
.steps li{padding-left:4px}
.tip{margin-top:16px;background:var(--sun-soft);color:var(--ink);border-radius:14px;padding:12px 14px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.panel{animation:none}#toast{transition:none}}
</style>
</head>

 'frikadeller':{k:"ælte farsen og forme frikadellerne",s:["Hak løget fint. Ælt hakket svinekød sammen med løg, æg, mel og mælk til en jævn farce. Smag til med salt og peber.","Lad farsen hvile i køleskabet i 15 minutter.","Form frikadeller med en ske, og steg dem ved middel varme i 8–10 minutter, til de er gennemstegte uden rosa kød.","Skræl kartoflerne, og kog dem møre på ca. 20 minutter.","Lav sovsen: smelt smørret i en gryde, og rør 30 g mel i. Tilsæt 4 dl mælk lidt ad gangen under omrøring, og smuldr bouillonterningen i. Lad sovsen simre i 5 minutter, og smag til med salt og peber.","Skær agurken i skiver, og server frikadeller og kartofler med sovsen."]},
 'tacos':{k:"snitte grøntsager og fylde deres egen taco",s:["Brun kødet på panden. Rør tacokrydderi i sammen med lidt vand, og lad det simre i 5 minutter.","Varm tacoskallerne i ovnen efter anvisningen på pakken.","Snit tomater, agurk, iceberg og peberfrugt, og dryp majsene af.","Sæt det hele på bordet sammen med revet ost og creme fraiche, så alle kan fylde deres egen taco."]},
 'kyllingestrimler':{k:"vende strimlerne i æg og rasp",s:["Tænd ovnen på 200 grader. Skær kartoflerne i både, vend dem i olie og salt, og bag dem i 35–40 minutter.","Skær kyllingen i strimler.","Pisk ægget i en dyb tallerken. Vend strimlerne først i ægget og derefter i rasp.","Steg strimlerne gyldne i 3–4 minutter på hver side, til de er gennemstegte.","Skær agurken i stave, og server med creme fraiche og ketchup til at dyppe i."]},
 'pandekager':{k:"piske dejen og skære bananerne",s:["Pisk mel, æg og halvdelen af mælken sammen til en glat dej. Rør resten af mælken i.","Lad dejen hvile i 10 minutter.","Steg tynde pandekager på en varm pande med lidt smør.","Skær bananerne i skiver, og server dem til pandekagerne."]},
 'fiskefrikadeller':{k:"skrælle gulerødderne",s:["Skræl kartoflerne, og kog dem møre på ca. 20 minutter.","Steg fiskefrikadellerne gyldne på panden efter anvisningen på pakken.","Skær gulerødderne i stave.","Server med remoulade."]},
 'pasta-kylling':{k:"plukke broccolien i buketter",s:["Kog pastaen efter anvisningen på pakken. Kog broccolibuketterne med de sidste 3 minutter.","Hak løg og hvidløg fint. Skær kyllingen i tern, og steg dem sammen med løg og hvidløg i 6–8 minutter, til kyllingen er gennemstegt.","Hæld fløden på panden, og lad det simre i 3–4 minutter. Smag til med salt og peber.","Vend pasta og broccoli i sovsen."]},
 'tortillapizza':{k:"lave deres egen pizza med deres yndlingstoppings",s:["Tænd ovnen på 220 grader.","Smør hakkede tomater ud på tortillaerne, og drys med oregano.","Fordel skinke i tern, majs, peberfrugt i strimler og ost ovenpå.","Bag i 8–10 minutter, til osten er gylden."]},
 'pastasalat':{k:"skære agurk og røre salaten sammen",s:["Kog pastaen efter anvisningen på pakken. Skyl den i koldt vand, og lad den køle af.","Skær agurk, tomater og skinke i tern.","Vend alt sammen med majs og creme fraiche. Smag til med salt og peber."]},
 'boller-karry':{k:"rulle bollerne",s:["Ælt hakket svinekød med æg, fint hakket løg, salt og peber. Form små boller.","Brun bollerne i en gryde.","Fjern bollerne fra gryden. Smelt smør i gryden, rør mel og karry (mild) i, og tilsæt 4 dl vand med bouillonterning og fløden under omrøring. Læg bollerne tilbage, og lad det simre i 10 minutter, til sovsen er jævn. Tilsæt ærterne de sidste 3 minutter.","Kog risene efter anvisningen på pakken, og server."]},
 'cheeseburger':{k:"bygge deres egen burger",s:["Tænd ovnen, og bag pommes frites efter anvisningen på pakken.","Form oksekødet til bøffer, og krydr med salt og peber.","Steg bøfferne i 3–4 minutter på hver side. Læg en skive ost på til sidst.","Rist burgerbollerne let.","Skær agurk i skiver. Byg burgerne med ketchup, salat, tomat og agurk."]},
 'hotdogs':{k:"samle deres egen hotdog",s:["Varm pølserne i varmt, men ikke kogende, vand eller på panden.","Varm hotdogbrødene i ovnen.","Skær agurken i skiver.","Saml hotdogs med remoulade, ristede løg og agurk."]},
 'omelet':{k:"piske æggene og rive osten",s:["Pisk æg og mælk sammen med salt og peber.","Skær skinke og peberfrugt i små tern.","Steg skinke og peberfrugt i 2 minutter på panden. Hæld æggeblandingen over, og drys med ost.","Lad omeletten stå ved svag varme, til den er stivnet.","Klip purløg ud over omeletten, og server med rugbrød."]},
 'gulerodssuppe':{k:"skrælle gulerødder og kartofler",s:["Skræl gulerødder, kartofler og løg, og skær dem i stykker.","Svits løgene i en gryde. Tilsæt resten af grøntsagerne, dæk med vand, og tilsæt bouillonterningen.","Kog i ca. 20 minutter, til alt er mørt.","Blend suppen glat med en stavblender (en voksen gør det), og rør fløden i.","Server med brød."]},
 'ovnlaks':{k:"presse citronen og plukke broccolien",s:["Tænd ovnen på 200 grader. Skræl kartoflerne, og kog dem møre.","Læg laksen i et smurt ovnfad, og krydr med salt, peber og lidt citronsaft. Bag i 15–18 minutter.","Kog broccolien sammen med kartoflerne de sidste 4 minutter.","Bland hakket dild i creme fraichen, og server den til laksen og kartoflerne."]},
 'kyllingelaar':{k:"skrælle gulerødder og kartofler",s:["Tænd ovnen på 200 grader.","Skær kartofler og gulerødder i stykker, og læg dem i et fad. Vend dem i olie, salt og peber.","Læg kyllingelårene ovenpå, og krydr dem.","Bag i ca. 45 minutter. Kyllingen skal være gennemstegt uden rosa kød."]},
 'lasagne':{k:"rive osten og lægge lagene",s:["Brun kødet sammen med hakket løg og revne gulerødder. Tilsæt hakkede tomater, og lad det simre i 15 minutter.","Lav hvid sovs: smelt smørret, rør mel i, og tilsæt mælken lidt ad gangen, til sovsen er tyk. Smag til med en knivspids muskatnød.","Læg lag i et ovnfad: kødsovs, lasagneplader og hvid sovs. Gentag, og slut med ost øverst.","Bag ved 200 grader i 35–40 minutter."]},
 'wok-kylling':{k:"skære grøntsager i strimler",s:["Kog nudlerne efter anvisningen på pakken.","Skær kyllingen i strimler, og steg den sammen med hakket hvidløg i 6–8 minutter, til den er gennemstegt.","Tilsæt gulerødder i tynde strimler, broccoli og peberfrugt, og steg i 5 minutter.","Vend nudlerne i, og hæld sojasovsen over. Smag til med peber."]},
 'tomatsuppe':{k:"lave ostetoasten",s:["Svits hakket løg og revne gulerødder i en gryde. Tilsæt hakkede tomater, bouillonterning og lidt vand, og kog i 15 minutter.","Blend suppen glat (en voksen gør det), og rør fløden i.","Læg ost mellem to skiver toastbrød, og rist dem gyldne.","Server suppen med ostetoast."]},
 'poelser-mos':{k:"mose kartoflerne",s:["Skræl kartoflerne, og kog dem møre på ca. 20 minutter.","Steg eller varm pølserne.","Mos kartoflerne med mælk og lidt smør til en jævn mos.","Kog ærterne i 3 minutter, og server."]},
 'aeggekage':{k:"piske dejen",s:["Tænd ovnen på 200 grader. Pisk mel, mælk og æg sammen til en glat dej.","Steg baconen sprød, og skær tomaterne i skiver.","Smør et ovnfad med smør. Hæld dejen i fadet, og fordel bacon og tomat ovenpå.","Bag i ca. 20 minutter, til æggekagen er gylden og fast."]},
 'koedboller-tomat':{k:"rulle kødbollerne",s:["Ælt kødet sammen med æg, fint hakket løg, rasp, salt og peber. Form små boller.","Brun bollerne i en gryde.","Tilsæt revne gulerødder, hakkede tomater, bouillonterning og oregano, og lad det simre i 15 minutter.","Kog pastaen efter anvisningen på pakken, og server."]},
 'quesadillas':{k:"fylde og folde tortillaerne",s:["Skær kyllingen i små tern, og steg dem i lidt olie sammen med tacokrydderi i 6–8 minutter, til de er gennemstegte.","Fordel kylling, majs, peberfrugt i strimler og ost på halvdelen af hver tortilla. Fold dem sammen.","Steg dem på en tør pande i 2–3 minutter på hver side, til osten er smeltet.","Skær i trekanter, og server med creme fraiche."]},
 'ovnpasta':{k:"blande alt sammen i fadet",s:["Tænd ovnen på 200 grader.","Kog pastaen 2 minutter kortere end angivet på pakken. Kog broccolien med de sidste 2 minutter.","Hak løget fint, og steg det i 3 minutter. Bland pasta, broccoli, skinke i tern, løg, hakkede tomater, fløde og oregano i et ovnfad.","Drys med ost, og bag i 20 minutter."]},
 'smoerrebroed':{k:"smøre rugbrødet tyndt, så der er plads til pålægget",s:["Skær rugbrødet i skiver, og smør dem tyndt med smør.","Lav de smørrebrød, I har valgt, som beskrevet under Smørrebrød herunder. Vælg dem med knappen Vælg smørrebrød."]},
 'kyllingesuppe':{k:"skrælle og skære gulerødderne i skiver",s:["Svits hakket løg og gulerødder i skiver i en gryde.","Tilsæt kylling i tern, bouillonterninger og vand, og kog i 15 minutter.","Tilsæt nudlerne, og kog dem efter anvisningen på pakken.","Smag til med salt og peber, og drys med hakket persille."]},
 'fiskefilet':{k:"presse citronen",s:["Skræl kartoflerne, og kog dem møre på ca. 20 minutter.","Pisk ægget i en dyb tallerken, og vend fileterne først i æg og derefter i rasp. Steg dem gyldne i smør i 3–4 minutter på hver side, eller følg anvisningen på pakken.","Kog ærterne i 3 minutter.","Server med remoulade og citronbåde."]},
 'wraps':{k:"fylde og rulle deres egen wrap",s:["Skær kyllingen i strimler, og steg den i lidt olie med paprika i 6–8 minutter, til den er gennemstegt.","Snit iceberg, agurk og tomater. Rør creme fraiche med citronsaft, salt og peber til en dressing.","Varm tortillaerne.","Fyld med kylling, grønt, majs og dressing, og rul dem sammen."]},
 'bagt-kartoffel':{k:"prikke kartoflerne med en gaffel og fylde dem",s:["Tænd ovnen på 200 grader. Prik kartoflerne med en gaffel, og bag dem i ca. 50 minutter.","Skær et snit i toppen, og mos lidt af indmaden sammen med smør.","Fyld med creme fraiche, skinke i tern, majs og ost, og gratiner i 5 minutter.","Klip purløg ovenpå, og server med agurk."]},
 'risotto-kylling':{k:"røre i gryden og rive osten",s:["Svits løg, tilsæt kylling i tern og karry, og steg i 6 minutter.","Tilsæt risene og vand med bouillonterning opløst i (to gange så meget vand som ris), og kog i ca. 12 minutter.","Tilsæt ærter og fløde, og kog i 3 minutter.","Rør osten i, og server."]},
 'pasta-pesto':{k:"røre pestoen i og rive osten",s:["Kog pastaen efter anvisningen på pakken.","Skær tomaterne i både.","Vend den varme pasta med pesto og tomater, og drys med revet ost."]},
 'ovnmakaroni':{k:"røre ostesovsen",s:["Tænd ovnen på 200 grader.","Kog pastaen 2 minutter kortere end angivet på pakken. Kog broccolien med de sidste 2 minutter.","Lav ostesovs: smelt lidt smør i en gryde, rør melet i, og tilsæt mælken lidt ad gangen under omrøring, til sovsen er tyk. Rør det meste af osten i.","Bland pasta, broccoli og ostesovs i et ovnfad, og drys med resten af osten.","Bag i 15–20 minutter, til osten er gylden."]},
 'kyllingespyd':{k:"stikke kylling og grønt på spyd, når en voksen har skåret spidsen af",s:["Skær kylling, peberfrugt og løg i stykker på ca. 3 cm.","Rør olie, paprika, citronsaft, salt og peber sammen, og vend kyllingen i marinaden. Træk dem på spyd.","Steg spydene på panden eller bag dem i ovnen ved 200 grader i 15–20 minutter. Vend dem undervejs. Kyllingen skal være gennemstegt uden rosa kød.","Kog risene efter anvisningen på pakken.","Server med agurk i skiver."]},
 'fiskeburger':{k:"bygge deres egen burger",s:["Steg eller bag fiskefileterne efter anvisningen på pakken.","Rist burgerbollerne let.","Snit iceberg og tomater.","Byg burgerne med remoulade, salat, tomat og fisk."]},
 'ovntorsk':{k:"presse citronen",s:["Tænd ovnen på 200 grader. Skræl og skær kartofler og gulerødder i stykker, vend dem i olie og salt, og bag dem i ca. 25 minutter.","Læg torsken i et smurt ovnfad, og krydr den med salt og lidt citronsaft. Fordel smør i klatter ovenpå.","Bag fisken i 12–15 minutter, til den let kan skilles i flager.","Bland hakket dild i creme fraichen, og server den til fisken."]},
 'tunpasta':{k:"røre alt sammen",s:["Kog pastaen efter anvisningen på pakken.","Hæld væsken fra tunen, og skær tomaterne i tern.","Vend pasta, tun, majs, tomater og creme fraiche sammen. Pres citronsaft over, smag til med salt og peber, og klip purløg ovenpå."]},
 'chili':{k:"skylle bønnerne og røre i gryden",s:["Hak løg og peberfrugt.","Brun kødet sammen med løgene i en gryde.","Tilsæt spidskommen, paprika, tomatpuré, bouillonterning, peberfrugt, hakkede tomater, skyllede kidneybønner og majs, og lad det simre i ca. 20 minutter.","Kog risene efter anvisningen på pakken, og server."]},
 'pitabroed':{k:"fylde deres egen pita",s:["Skær kyllingen i strimler, og steg den i lidt olie med paprika i 6–8 minutter, til den er gennemstegt.","Snit iceberg, agurk og tomater. Rør creme fraiche med citronsaft, salt og peber til en dressing.","Varm pitabrødene i ovnen eller i en brødrister.","Fyld pitabrødene med kylling, salat og dressing."]},
 'poelsegryde':{k:"skære pølserne i skiver",s:["Kog risene efter anvisningen på pakken.","Svits hakket løg og revne gulerødder i en gryde.","Skær pølserne i skiver, og brun dem sammen med grøntsagerne.","Tilsæt hakkede tomater, bouillonterning og oregano, og lad det simre i 10 minutter. Server med ris."]},
 'kartoffelsuppe':{k:"skrælle kartoflerne",s:["Skræl og skær kartofler, gulerødder, løg og porre i stykker.","Kog grøntsagerne i vand med bouillonterningerne i ca. 20 minutter, til de er møre.","Blend suppen delvist med en stavblender (en voksen gør det), så der stadig er små stykker.","Skær pølserne i skiver, og varm dem i suppen i 5 minutter. Drys med hakket persille."]},
 'hakkeboef':{k:"forme bøfferne",s:["Skræl kartoflerne, og kog dem møre på ca. 20 minutter.","Form hakket oksekød til bøffer, og krydr med salt og peber.","Skær løgene i skiver, og steg dem bløde og gyldne på panden. Tag dem af.","Steg bøfferne i smør i 4–5 minutter på hver side, til de er gennemstegte uden rosa kød.","Lav sovsen: hæld stegefedtet fra panden, smelt smør, og rør mel i. Tilsæt 2 dl vand med bouillonterning og mælken under omrøring, og lad sovsen simre i 5 minutter. Kog ærterne i 3 minutter, og server hakkebøffen med løg, kartofler og sovs."]},
 'floedekartofler':{k:"lægge kartoffelskiver i fadet",s:["Tænd ovnen på 180 grader.","Skræl kartoflerne, og skær dem i tynde skiver. Skær løg i tynde skiver, og steg baconen let.","Læg kartofler, løg og bacon i lag i et ovnfad.","Hak hvidløg, og rør det i fløden sammen med en knivspids muskatnød. Hæld fløden over, og krydr med salt og peber. Dæk med alufolie.","Bag i ca. 45 minutter. Tag folien af de sidste 10 minutter, så toppen bliver gylden."]},
 'kyllingeburger':{k:"vende kyllingen i æg og rasp",s:["Skær kyllingen i tynde skiver, så de bliver ens tykke.","Pisk ægget i en dyb tallerken. Vend kyllingen først i ægget og derefter i rasp.","Steg i lidt olie i 4–5 minutter på hver side, til kyllingen er gennemstegt uden rosa kød.","Rist burgerbollerne let, og snit iceberg og tomater.","Skær agurken i skiver. Byg burgerne med creme fraiche, ketchup, salat, tomat, agurk og kylling."]},
 'pizzatoast':{k:"lægge pålæg og ost på toastbrødet",s:["Tænd ovnen på 200 grader, og læg toastbrødet på en bageplade.","Smør hakkede tomater ud på brødet, og drys med oregano.","Fordel skinke i tern, majs og ost ovenpå.","Bag i 8–10 minutter, til osten er gylden."]},
 'roeraeg':{k:"piske æggene",s:["Steg baconen sprød, og læg den på et stykke køkkenrulle.","Pisk æggene med mælk, salt og peber, og rør dem i smør ved svag varme, til de er stivnet.","Rist toastbrødet, og skær tomaterne i skiver.","Klip purløg over æggene, og server med bacon, toast og tomater."]},
 'havregroed':{k:"skære frugten i tern",s:["Kog havregryn og mælk med en knivspids salt under omrøring i ca. 5 minutter, til grøden er tyk.","Skær bananer og æbler i små tern.","Server grøden med frugt ovenpå, og drys med kanel."]},
 'kartoffelpandekager':{k:"røre dejen",s:["Skræl og riv kartoflerne, og pres vandet fra.","Riv løget, og bland det med kartoflerne, æg, mel, salt og peber.","Steg små pandekager på en pande med lidt olie i 3–4 minutter på hver side.","Steg baconen sprød.","Server med agurk i skiver og creme fraiche."]},
 'groentsagsfrikadeller':{k:"rive grøntsager og røre dejen",s:["Skræl gulerødder og kartofler. Kog kartoflerne møre på ca. 20 minutter.","Riv gulerødder og squash, og pres vandet fra.","Riv løget, og bland det med grøntsagerne, æg, mel, salt og peber.","Form små frikadeller, og steg dem gyldne i smør i 3–4 minutter på hver side.","Server med kartofler og creme fraiche."]},
 'carbonara':{k:"vende pastaen i sovsen",s:["Kog pastaen efter anvisningen på pakken, og gem lidt af kogevandet.","Hak hvidløg, og steg det sammen med baconen, til baconen er sprød.","Pisk æg, ost og fløde sammen med friskkværnet peber.","Tag panden af varmen, og vend den varme pasta og baconen i æggeblandingen. Rør hurtigt, til sovsen er cremet og ægget er varmet igennem. Tilsæt lidt kogevand, hvis den er for tyk."]},
 'kyllingegryde':{k:"røre i gryden",s:["Svits hakket løg i en gryde, og tilsæt kylling i tern. Steg i 6 minutter, og drys med mel.","Tilsæt gulerødder i skiver, fløde og 2 dl vand med bouillonterning, og lad det simre i 15 minutter.","Kog risene efter anvisningen på pakken.","Tilsæt ærterne de sidste 3 minutter. Smag til med salt og peber, og server med ris."]},
 'kokoskarry':{k:"røre kokosmælken i",s:["Svits hakket løg og gulerødder i skiver i en gryde.","Tilsæt kylling i tern, karry og et æble i tern, og steg i 5 minutter.","Hæld kokosmælken og 1 dl vand med bouillonterning i, og lad det simre i 15 minutter, til kyllingen er gennemstegt.","Kog risene efter anvisningen på pakken, og server."]},
 'fiskestaenger':{k:"vende fiskestængerne i æg og rasp",s:["Tænd ovnen på 200 grader. Skær kartoflerne i både, vend dem i olie og salt, og bag dem i ca. 35 minutter.","Skær torsken i stænger. Pisk ægget, og vend stængerne først i æg og derefter i rasp.","Steg stængerne gyldne i smør på panden i 2–3 minutter på hver side.","Kog ærterne i 3 minutter.","Server med remoulade og citronbåde."]},
 'pasta-skinke-aerter':{k:"røre alt sammen",s:["Kog pastaen efter anvisningen på pakken. Tilsæt ærterne de sidste 3 minutter.","Hak løget fint, og steg det i 3 minutter. Skær skinken i tern, og varm den med løg og fløde i en gryde i 3–4 minutter.","Rør osten i sovsen. Vend pasta og ærter i sovsen, og smag til med salt og peber."]},
 'skjult-groent':{k:"rive gulerødder og squash",s:["Svits hakket løg i olie i en gryde. Riv gulerødder og squash, og tilsæt dem.","Hæld hakkede tomater i, tilsæt bouillonterning og oregano, og kog i 15 minutter.","Blend sovsen helt glat med en stavblender (en voksen gør det).","Kog pastaen efter anvisningen på pakken, og vend den i sovsen.","Drys med revet ost."]},
 'nudelsalat':{k:"snitte grøntsager",s:["Kog nudlerne efter anvisningen på pakken, skyl dem i koldt vand, og lad dem køle af.","Skær kyllingen i strimler, og steg den i 6–8 minutter, til den er gennemstegt. Lad den køle af.","Skær gulerødder, agurk og peberfrugt i tynde strimler.","Rør creme fraiche, sojasovs og citronsaft sammen til en dressing. Vend alt sammen med majs og dressing. Smag til med peber."]},
 'mexicansk-ris':{k:"røre i gryden og drysse ost",s:["Hak peberfrugt og løg. Brun kødet sammen med løgene på en stor pande, og rør tacokrydderi i.","Tilsæt hakkede tomater, majs og peberfrugt, og lad det simre i 10 minutter.","Kog risene efter anvisningen på pakken, og bland dem med kødblandingen.","Drys med revet ost, og lad den smelte. Server med creme fraiche."]},
 'enchiladas':{k:"fylde og rulle tortillaerne",s:["Tænd ovnen på 200 grader.","Hak løget, og brun det sammen med kødet. Rør tacokrydderi, majs og halvdelen af de hakkede tomater i.","Fyld tortillaerne med kødblandingen, og rul dem sammen. Læg dem i et ovnfad.","Hæld resten af tomaterne over, og drys med ost.","Bag i 15–20 minutter, til osten er gylden. Server med creme fraiche."]},
 'fyldt-peberfrugt':{k:"fylde peberfrugterne",s:["Tænd ovnen på 200 grader. Kog risene efter anvisningen på pakken.","Brun kødet sammen med hakket løg, og bland det med risene, de hakkede tomater, oregano og en smuldret bouillonterning.","Skær toppen af peberfrugterne, og fjern kernerne. Fyld dem med kødblandingen, og drys med ost.","Bag i 25–30 minutter, til peberfrugterne er bløde."]},
 'ovn-poelser':{k:"skære grøntsager ud",s:["Tænd ovnen på 200 grader.","Skær kartofler, gulerødder, løg og squash i stykker, og vend dem i olie, salt og peber i et stort fad.","Bag i 25 minutter.","Skær pølserne i stykker, og læg dem i fadet. Bag 15–20 minutter mere. Server med ketchup og sennep."]},
 'aeggesalat':{k:"hakke æggene og røre salaten",s:["Kog æggene i 8 minutter, skyl dem i koldt vand, og skræl dem.","Hak æggene, og vend dem med creme fraiche, salt og peber.","Skær agurk og tomater i skiver.","Server æggesalaten på rugbrød med agurk og tomat, og klip purløg ovenpå."]},
 'stegt-flaesk':{k:"røre mel og mælk til sovsen og hakke persillen",s:["Skræl kartoflerne, og kog dem i letsaltet vand i ca. 20 minutter.","Steg flæsket på en tør pande ved middel varme, til det er gyldent og sprødt på begge sider. Tag det op på køkkenrulle.","Smelt smørret i en gryde, og rør melet i. Tilsæt mælken lidt ad gangen under omrøring, og lad sovsen simre 5 minutter.","Hak persillen fint, og rør den i sovsen. Smag til med salt og peber.","Server flæsket med kartofler og persillesovs."]},
 'millionboef':{k:"mose kartoflerne og røre i farsen",s:["Skræl kartoflerne, og kog dem møre i ca. 20 minutter.","Hak løget, og brun det hakkede oksekød med løget i en gryde i 5 minutter.","Tilsæt de hakkede tomater, tomatpuré, bouillonterning, salt og peber, og lad det simre i 15 minutter.","Mos kartoflerne med smør og mælk til en blød mos.","Server millionbøffen med kartoffelmos."]},
 'medister':{k:"skrælle gulerødderne og mose kartoflerne",s:["Skræl kartofler og gulerødder, og kog dem møre i ca. 20 minutter.","Steg medisterpølsen på en pande ved middel varme i ca. 15 minutter, til den er gennemstegt og gylden.","Mos kartoflerne med smør og mælk.","Lav sovsen: smelt 20 g smør i en gryde, og rør melet i. Tilsæt 4 dl vand med bouillonterning under omrøring, og lad sovsen simre i 5 minutter. Server pølsen med kartoffelmos, gulerødder og sovs."]},
 'biksemad':{k:"skære kartofler i tern og knække æggene",s:["Kog kartoflerne møre, og lad dem køle lidt af. Skær dem i tern.","Skær pølserne i tern, og hak løget.","Steg kartofler, pølser og løg i smør på en stor pande, til det er gyldent. Smag til med salt og peber.","Steg et spejlæg til hver, og server med rugbrød, rødbeder og ketchup."]},
 'braendende-kaerlighed':{k:"mose kartoflerne",s:["Skræl kartoflerne, og kog dem møre i ca. 20 minutter. Mos dem med smør og mælk.","Skær bacon i tern, og steg dem sprøde. Tag dem af panden.","Hak løgene, og steg dem i baconfedtet, til de er bløde og gyldne.","Læg mosen på en tallerken, og top med bacon og løg."]},
 'tarteletter':{k:"fylde tarteletterne og lægge dem på bagepladen",s:["Tænd ovnen på 180 grader. Varm tarteletskallerne efter anvisningen på pakken.","Kog kyllingen i vand med bouillonterning i ca. 15 minutter, og skær den i små tern.","Smelt smørret i en gryde, rør melet i, og tilsæt fløden under omrøring. Lad sovsen simre 5 minutter.","Rør kyllingen og aspargesene i sovsen, og smag til med citronsaft, salt og peber.","Fyld skallerne, og server med det samme."]},
 'helstegt-kylling':{k:"skrælle gulerødder og krydre kyllingen",s:["Tænd ovnen på 200 grader. Tag kyllingen ud af køleskabet 30 minutter før.","Smør kyllingen med smør, krydr den med salt, peber og paprika, og læg den i et ovnfad.","Skær kartofler og gulerødder i store stykker, og skær løget i både. Læg dem rundt om kyllingen med lidt olie og salt.","Steg i ca. 1 time og 15 minutter, til saften er klar, og kyllingen er helt gennemstegt. En voksen tjekker det.","Lad kyllingen hvile i 10 minutter, før den skæres. Lav sovs: hæld stegefonden i en gryde, rør mel ud i lidt koldt vand, og tilsæt det sammen med 3 dl vand og bouillonterning. Lad sovsen simre i 5 minutter."]},
 'roedspaette':{k:"vende fiskene i æg og rasp",s:["Skræl kartoflerne, og kog dem møre i ca. 20 minutter.","Pisk ægget i en dyb tallerken. Vend fiskefileterne først i ægget og derefter i rasp.","Steg fileterne i smør på en pande i ca. 3 minutter på hver side, til de er gyldne.","Hak persille, og server med kartofler, remoulade og citronbåde."]},
 'hoensesuppe':{k:"rulle melbollerne",s:["Kog kyllingen i en stor gryde med vand, bouillonterningerne, et helt skrællet løg, salt og peber i ca. 30 minutter. Tag den op, og skær den i stykker.","Skræl gulerødderne, og skær dem og porren i skiver. Kog dem i suppen i 15 minutter.","Rør mel, mælk, æg og smør til en dej. Form små boller med to teskeer.","Kog bollerne i suppen i ca. 5 minutter, til de flyder op.","Fjern løget, kom kyllingen tilbage i suppen, og smag til. Drys med hakket persille."]},
 'flaeskesteg':{k:"dyppe kartoflerne i smør og hjælpe med at servere",s:["Tænd ovnen på 225 grader. Krydr flæskestegen med salt og peber, og læg den på en rist over et fad. Kom løg i både, laurbærblade og 2 dl vand med bouillonterning i fadet.","Steg i 30 minutter. Skru ned på 180 grader, og steg i 1 time til, indtil et stegetermometer viser 75 grader og sprødet er helt sprødt.","Skræl kartoflerne, og kog dem møre. Varm rødkålen op.","Rør melet ud i lidt koldt vand, og jævn stegefonden til en sovs.","Lad stegen hvile 10 minutter, og skær den i skiver. Server med kartofler, rødkål og sovs."]}
};

    map.forEach(m=>{if(m[0].test(t)&&!out.some(o=>o.n===m[1][0]))out.push({n:m[1][0],q:m[1][1],u:m[1][2],kind:kind});});

  run(NEEDS[id],MEATMAP,'kød');run(SIDE[id],SIDEMAP,'tilbehør');
  if(NOBASE.indexOf(id)<0)BASEVEG.forEach(b=>{if(!out.some(o=>o.n===b[0]))out.push({n:b[0],q:b[1],u:b[2],kind:'tilbehør'});});
  if(NOBASE.indexOf(id)<0)SALADS.forEach(x=>out.push(x));
  return out;
}

function canon(n){
  n=n.toLowerCase().replace(/\([^)]*\)/g,'').split(',')[0].replace(/crème/g,'creme').replace(/fraîche/g,'fraiche').replace(/\d+([.,]\d+)?\s*%/g,'').replace(/^af\s+/,'').replace(/\s+/g,' ').trim();

  const known=Object.keys(CATOF).sort((a,b)=>b.length-a.length);
  for(const k of known){if(new RegExp('(^|\\s)'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|\\s)').test(n))return k;}
  return n;

/* Én ingrediens-linje, fx "400 g hakket oksekød" → [navn, mængde, enhed] eller null */
function parseIng(line){
  let t=clean(line).replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();
  if(!t||PANTRY.test(t.toLowerCase()))return null;
  const fr={'½':.5,'¼':.25,'¾':.75,'⅓':1/3};
  let q=null,rest=t,m;
  if((m=t.match(/^(\d+)?\s*([½¼¾⅓])\s*(.*)$/))){q=(+m[1]||0)+fr[m[2]];rest=m[3];}
  else if((m=t.match(/^(\d+)\s+(\d+)\/(\d+)\s+(.*)$/))){q=+m[1]+m[2]/m[3];rest=m[4];}
  else if((m=t.match(/^(\d+)\/(\d+)\s+(.*)$/))){q=m[1]/m[2];rest=m[3];}
  else if((m=t.match(/^(\d+(?:[.,]\d+)?)\s*(?:-|–|til)\s*\d+(?:[.,]\d+)?\s*(.*)$/))){q=parseFloat(m[1].replace(',','.'));rest=m[2];}
  else if((m=t.match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/))){q=parseFloat(m[1].replace(',','.'));rest=m[2];}
  let unit='stk',f=1;
  if((m=rest.match(/^([A-Za-zÆØÅæøå]+)\.?(?:\s+(.*))?$/))&&UMAP[m[1].toLowerCase()]&&m[2]){f=UMAP[m[1].toLowerCase()][0];unit=UMAP[m[1].toLowerCase()][1];rest=m[2];}
  const name=canon(rest.replace(/^(en|et|lidt)\s+/i,''));
  if(!name||PANTRY.test(name))return null;
  return [name,Math.round((q==null?1:q)*f*100)/100,unit];
}
function isoMin(v){
  if(typeof v!=='string')return 0;
  const m=v.match(/^P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?/);
  return m?(+m[1]||0)*1440+(+m[2]||0)*60+(+m[3]||0):0;
}
function plain(s){try{return clean(new DOMParser().parseFromString(String(s),'text/html').documentElement.textContent);}catch(e){return clean(s);}}
function steps(x){
  if(!x)return [];
  if(typeof x==='string')return x.split(/\n+/).map(plain).filter(Boolean);
  if(Array.isArray(x))return x.reduce((a,y)=>a.concat(steps(y)),[]);
  if(x.itemListElement)return steps(x.itemListElement);
  return steps(x.text||x.name||'');
}

/* Opskrift fra ren tekst: leder efter overskrifterne Ingredienser og Fremgangsmåde */
function parseRecipeText(text){
  const L=String(text).split(/\n+/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
  const isIng=x=>/^ingredienser\b/i.test(x),isSt=x=>/^(fremgangsmåde|sådan gør (du|man)|tilberedning|instruktioner|metode)\b/i.test(x);
  const stop=x=>/^(tip|tips|næringsindhold|næring|print|del\b|kommentarer?|se også|gem opskrift|relaterede|mere inspiration|abonner|nyhedsbrev)/i.test(x);
  const a=L.findIndex(isIng);if(a<0)return null;
  let b=L.findIndex((x,i)=>i>a&&isSt(x));
  const end=b<0?Math.min(L.length,a+40):b;
  const ing=[];
  for(let i=a+1;i<end;i++){const x=L[i];if(stop(x))break;if(/:$/.test(x)&&!/\d/.test(x))continue;if(x.length<=100)ing.push(x);}
  const steps=[];
  if(b>=0){for(let i=b+1;i<L.length&&steps.length<20;i++){const x=L[i];if(stop(x))break;if(x.length>12)steps.push(x);}}
  const head=L.slice(0,a).join(' '),y=head.match(/(\d+)\s*(pers|portioner|personer)/i),t=head.match(/(\d+)\s*min/i);
  return ing.length?{n:'',m:t?+t[1]:0,p:y?+y[1]:0,ing:ing,steps:steps}:null;
}
/* Andre måder en opskrift kan ligge på en side: microdata og de mest brugte opskriftsplugins */
function parseOther(doc){
  const txt=e=>plain(e.textContent||''),all=(r,sel)=>Array.from(r.querySelectorAll(sel));
  const num=x=>{const m=String(x||'').match(/\d+/);return m?+m[0]:0;};
  const root=doc.querySelector('[itemtype*="schema.org/Recipe"]')||doc.querySelector('.wprm-recipe-container,.tasty-recipes,.mv-create-wrapper,.recipe-card')||null;
  if(root){
    let ing=all(root,'[itemprop="recipeIngredient"],[itemprop="ingredients"],.wprm-recipe-ingredient,.tasty-recipes-ingredients li,.mv-create-ingredients li').map(txt).filter(Boolean);
    let st=all(root,'.wprm-recipe-instruction-text,.tasty-recipes-instructions li,.mv-create-instructions li').map(txt).filter(Boolean);
    if(!st.length){const si=root.querySelector('[itemprop="recipeInstructions"]');if(si){const li=all(si,'li,p').map(txt).filter(Boolean);st=li.length?li:si.textContent.split(/\n+/).map(plain).filter(Boolean);}}
    if(ing.length){
      const nm=root.querySelector('[itemprop="name"],.wprm-recipe-name,.tasty-recipes-title');
      const yl=root.querySelector('[itemprop="recipeYield"],.wprm-recipe-servings,.tasty-recipes-yield');
      const tm=root.querySelector('[itemprop="totalTime"],[itemprop="prepTime"]');
      const mins=tm?(isoMin(tm.getAttribute('content')||tm.getAttribute('datetime')||'')||num(tm.textContent)):0;
      return {n:nm?txt(nm):'',m:mins,p:yl?num(yl.getAttribute('content')||yl.textContent):0,ing:ing,steps:st};
    }
  }
  const body=doc.body;if(!body)return null;
  all(body,'script,style,nav,footer,noscript').forEach(e=>e.remove());
  all(body,'h3,h4,h5,h6').forEach(e=>e.append(':'));
  all(body,'td,th,dt').forEach(e=>e.append(' '));
  all(body,'br,p,li,div,h1,h2,h3,h4,h5,h6,tr,dd').forEach(e=>e.append('\n'));
  const r=parseRecipeText(body.textContent||'');
  if(r){const h=doc.querySelector('h1');r.n=h?txt(h):plain((doc.querySelector('title')||{}).textContent||'');}
  return r;
}
/* Finder en opskrift i sidens ld+json (schema.org/Recipe). Returnerer null, hvis der ikke er nogen. */
function parseRecipeHtml(html){
  let doc;try{doc=new DOMParser().parseFromString(html,'text/html');}catch(e){return null;}
  let found=null;
  const walk=o=>{
    if(found||!o)return;
    if(Array.isArray(o)){o.forEach(walk);return;}
    if(typeof o!=='object')return;
    const t=[].concat(o['@type']||[]);
    if(t.indexOf('Recipe')>=0){found=o;return;}
    if(o['@graph'])walk(o['@graph']);
  };
  doc.querySelectorAll('script[type="application/ld+json"]').forEach(sc=>{try{walk(JSON.parse(sc.textContent));}catch(e){}});
  if(!found)return parseOther(doc);
  const y=[].concat(found.recipeYield||[]).join(' ').match(/\d+/);
  const mins=isoMin(found.totalTime)||(isoMin(found.prepTime)+isoMin(found.cookTime));
  return {n:plain(found.name||''),m:mins||0,p:y?+y[0]:0,ing:[].concat(found.recipeIngredient||[]).map(plain).filter(Boolean),steps:steps(found.recipeInstructions)};
}

async function fetchRecipe(u){
  const tried=[],w=getWorker().trim().replace(/\/+$/,'');

  if(/^https:\/\//.test(w))tries.push(['egen tjeneste',x=>w+(w.indexOf('?')<0?'?':'&')+'url='+encodeURIComponent(x)]);

  for(const t of tries){
    try{
      const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),12000);
      const r=await fetch(t[1](u),{signal:ctl.signal});clearTimeout(tm);
      const h=await r.text();
      const ti=(h.match(/<title[^>]*>([^<]{0,60})/i)||[])[1];
      const rec=r.ok?parseRecipeHtml(h):null;

    }catch(e){tried.push(t[0]+': ingen forbindelse');}
  }

}

function customFor(wk){return S.custom.filter(c=>c.w===wk||(c.w<wk&&!S.shop['x-'+c.id]));}
function pruneChecks(){
  if(!S.shopSig)S.shopSig={};
  const cur={},wks={};upcoming().forEach(p=>{wks[wkOf(p.date)]=1;});Object.keys(S.snacks).forEach(w=>{wks[w]=1;});
  Object.keys(wks).forEach(w=>shopList(w).forEach(i=>{cur[i.key]=i.q+'|'+i.u;}));
  Object.keys(S.shop).forEach(k=>{
    if(k.indexOf('x-')===0){if(!S.custom.some(c=>'x-'+c.id===k)){delete S.shop[k];}return;}
    if(!(k in cur)){delete S.shop[k];delete S.shopSig[k];return;}
    if(S.shopSig[k]===undefined)S.shopSig[k]=cur[k];
    else if(S.shopSig[k]!==cur[k]){delete S.shop[k];delete S.shopSig[k];}
  });
}
function persist(){
  try{pruneChecks();}catch(e){}
  const v=snap();
  try{localStorage.setItem(KEY,JSON.stringify(v));saveOk.ls=localStorage.getItem(KEY)!==null;}catch(e){saveOk.ls=false;}
  idbPut(v).then(()=>{saveOk.idb=true;renderTop();}).catch(()=>{saveOk.idb=false;renderTop();});
  renderTop();
}
function load(){
  try{localStorage.setItem('__t','1');localStorage.removeItem('__t');saveOk.ls=true;}catch(e){}
  try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r)applySnap(r);}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  idbGet().then(r=>{
    saveOk.idb=true;
    let cur=null;try{cur=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
    if(r&&(!cur||(r.at||0)>(cur.at||0))){applySnap(r);render();}
    renderTop();
  }).catch(()=>{renderTop();});
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3200);}

/* ---------- Beregninger ---------- */
function upcoming(wk){const t=todayKey();return Object.values(S.plan).filter(p=>p&&p.dishId&&dish(p.dishId)&&p.date>=t&&(!wk||wkOf(p.date)===wk)).sort((a,b)=>a.date<b.date?-1:1);}
function ingSet(list){const m=new Map();list.forEach(d=>d&&d.ing.forEach(i=>m.set(i[0],(m.get(i[0])||0)+1)));return m;}
function ratingInfo(id){
  const v=Object.values(S.ratings).filter(r=>r.dish===id&&r.stars>0);
  const n=v.length,avg=n?v.reduce((a,r)=>a+r.stars,0)/n:0;
  const mine=(S.ratings[id+'__'+me()]||{}).stars||0;
  return {n,avg,mine};
}
function verdict(id){const r=ratingInfo(id);if(!r.n)return 'ny';if(r.avg>=4)return 'fav';if(r.avg<=2.4)return 'nej';return 'ok';}
function suggest(excludeDate){
  const wk=wkOf(excludeDate);
  const others=upcoming(wk).filter(p=>p.date!==excludeDate);
  const chosen=others.map(p=>dish(p.dishId));
  const U=ingSet(chosen.concat(snackEntries(wk)));const taken=new Set(chosen.map(d=>d.id));
  return DISHES.filter(d=>!taken.has(d.id)).map(d=>{
    const names=d.ing.map(i=>i[0]);
    const shared=names.filter(n=>U.has(n)).sort((a,b)=>WOF[b]-WOF[a]);
    const w=shared.reduce((a,n)=>a+WOF[n],0);
    const r=ratingInfo(d.id);const bonus=r.n?(r.avg-3)*2.5:0;
    return {d:d,shared:shared,fresh:names.length-shared.length,v:verdict(d.id),score:(chosen.length?w*2-(names.length-shared.length)*0.4:0)+bonus,hasChosen:chosen.length>0};
  }).sort((a,b)=>b.score-a.score);
}
function roundQty(q,u){if(u==='g')return q<200?Math.ceil(q/10-1e-9)*10:Math.ceil(q/50-1e-9)*50;if(u==='dl')return Math.ceil(q*2-1e-9)/2;if(u==='l')return Math.max(0.5,Math.ceil(q*2-1e-9)/2);return Math.max(1,Math.ceil(q-1e-9));}
const numFmt=n=>String(Math.round(n*10)/10).replace('.',',');
function fmtQty(q,u){
  if(u==='g')return q>=1000?numFmt(q/1000)+' kg':numFmt(q)+' g';
  if(u==='dåse')return numFmt(q)+(q===1?' dåse':' dåser');
  if(u==='bæger')return numFmt(q)+(q===1?' bæger':' bægre');
  return numFmt(q)+' '+u;
}
/* Mængde i en opskrift: hele og halve pakker vises som ½, 1, 1½ osv. */
/* Bagning: ingredienserne vises i gram, fordi det er mere nøjagtigt. Indkøbslisten bruger stadig det, man køber (fx æg i stk og mælk i dl). */
const BAKEG=['pandekager','s-polsehorn','s-pizzasnegle','s-boller','s-kanelsnegle','s-chokolademuffins','s-bananmuffins','s-ostestaenger','s-aeggemuffins','s-aebleskiver','s-rundstykker','s-vafler','s-gulerodskage','s-muslibar','s-skinkeruller','s-pizzaboller'];
const GRAM={'mælk|dl':100,'olie|dl':90,'olie|spsk':12,'æg|stk':55,'banan|stk':110,'gulerødder|stk':100,'æbler|stk':150,'gær|pk':50,'bagepulver|pk':12,'kanel|pk':10,'kanel|tsk':3,'kardemomme|tsk':2,'sukker|spsk':12,'vaniljesukker|spsk':10,'kakao|spsk':7,'honning|spsk':20,'perlesukker|spsk':10,'yoghurt naturel|dl':100};
function bakeQty(d,i){
  const q=i[1]*S.people/4,f=BAKEG.indexOf(d.id)>=0?GRAM[i[0]+'|'+i[2]]:0;
  if(!f)return fmtRecipeQty(q,i[2]);
  if(i[0]==='gær'){const fr=Math.round(q*f/5)*5;return fr+' g frisk<br>'+Math.max(1,Math.round(fr/3))+' g tør';}
  const g=q*f,r=g<30?Math.max(1,Math.round(g)):g<200?Math.round(g/5)*5:Math.round(g/10)*10;
  return numFmt(r)+' g';
}
function fmtRecipeQty(q,u){
  if(u==='g'||u==='dl')return fmtQty(roundQty(q,u),u);
  const r=Math.max(0.5,Math.round(q*2)/2),w=Math.floor(r),n=(w?w:'')+(r%1?'½':'');
  const L={'dåse':['dåse','dåser'],'bæger':['bæger','bægre'],'glas':['glas','glas'],'pk':['pk','pk'],'stk':['stk','stk']}[u]||[u,u];
  return n+' '+(r<=1?L[0]:L[1]);
}
const slug=s=>s.toLowerCase().replace(/æ/g,'ae').replace(/ø/g,'oe').replace(/å/g,'aa').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function shopList(wk){
  const m=new Map();
  upcoming(wk).map(p=>dish(p.dishId)).concat(snackEntries(wk)).forEach(d=>{
    d.ing.forEach(i=>{
      const mk=i[0]==='mælk'&&i[2]==='dl',iu=mk?'l':i[2],iq=mk?i[1]/10:i[1];
      const k=i[0]+'|'+iu;
      const e=m.get(k)||{n:i[0],u:iu,q:0,dishes:[]};
      e.q+=iq*S.people/4;
      if(e.dishes.indexOf(d.n)<0)e.dishes.push(d.n);
      m.set(k,e);
    });
  });
  upcoming(wk).forEach(p=>{
    const d=dish(p.dishId);
    chosenItems(p.dishId).forEach(it=>{
      const lab=d.n+(d.id==='smoerrebroed'?' (smørrebrød)':' (tilbehør)');
      (it.parts||[[SIDEING[it.n]||it.n.toLowerCase(),it.q,it.u]]).forEach(pt=>{
        const nm=pt[0],mk=nm==='mælk'&&pt[2]==='dl',pu=mk?'l':pt[2],pq=mk?pt[1]/10:pt[1],k=nm+'|'+pu;
        const e=m.get(k)||{n:nm,u:pu,q:0,dishes:[]};
        e.q+=pq*S.people/4;
        if(e.dishes.indexOf(lab)<0)e.dishes.push(lab);
        m.set(k,e);
      });
    });
  });
  return Array.from(m.values()).map(e=>({n:e.n,u:e.u,dishes:e.dishes,q:roundQty(e.q,e.u),key:slug(e.n+' '+e.u)+(wk?'@'+wk:''),cat:CATOF[e.n]||'Kolonial'}));
}

function facts(d){
  const h=HEALTH[d.id]||2,lab=['','Hyggemad','Okay','Sund'][h];
  let lv='';
  for(let i=1;i<=3;i++)lv+='<svg class="ic'+(i<=h?' on':'')+'" viewBox="0 0 24 24" aria-hidden="true">'+LEAF+'</svg>';
  return '<span class="facts"><span class="fact"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>ca. '+d.m+' min</span><span class="hl h'+h+'">'+lv+lab+'</span></span>';
}
const tile=(d,sm)=>'<span class="tile t'+(d.i%5)+(sm?' sm':'')+'" aria-hidden="true">'+d.e+'</span>';
function stars(id,mine){
  let h='<span class="stars" role="group" aria-label="Giv karakter">';
  for(let i=1;i<=5;i++)h+='<button class="st'+(i<=mine?' on':'')+'" data-a="star" data-dish="'+id+'" data-n="'+i+'" aria-label="'+i+' ud af 5">★</button>';
  return h+'</span>';
}
function famLine(id){
  const r=ratingInfo(id),v=verdict(id);
  if(!r.n)return 'Ikke prøvet endnu';
  const base='Karakter '+numFmt(r.avg)+' ★ ('+r.n+')';
  return base+(v==='fav'?' · vi vil gerne have den igen':v==='nej'?' · ikke igen':'');
}
function badge(v){return v==='fav'?'<span class="badge">Favorit</span>':v==='nej'?'<span class="badge no">Ikke igen</span>':'';}

function sugRow(s,date){
  const d=s.d;
  const sh=s.shared.length?'<span class="shared">Bruger også: '+s.shared.slice(0,3).join(', ')+(s.shared.length>3?' +'+(s.shared.length-3):'')+'</span>':'';
  return '<button class="drow" data-a="pick" data-dish="'+d.id+'"'+(date?' data-date="'+date+'"':'')+'>'+tile(d,true)+'<span class="dmain"><span class="dname">'+d.n+badge(s.v)+'</span>'+facts(d)+(DESC[d.id]?'<span class="dmeta">'+DESC[d.id]+'</span>':'')+(s.hasChosen?'<span class="dmeta">'+s.fresh+' nye varer at købe</span>':'')+(NEEDS[d.id]?'<span class="needs">Mangler kød eller fisk</span>':'')+sh+'</span></button>';
}

function planCard(k){
  const p=S.plan[k],d=p.dishId?dish(p.dishId):null,t=todayKey();
  let h='<section class="card" id="card-'+k+'"><div class="chead"><h3>'+cap(longDate(k))+'</h3><button class="link" data-a="remove" data-date="'+k+'">Fjern dag</button></div>';
  if(S.confirmDay===k)h+='<div class="confirm" role="alert"><span>Fjern denne dag'+(d?' og '+d.n:'')+'?</span><span class="row" style="margin:0"><button class="btn danger" data-a="removeyes" data-date="'+k+'">Ja, fjern</button><button class="btn ghost" data-a="removeno">Behold</button></span></div>';
  if(!d){
    const sug=suggest(k).filter(s=>s.v!=='nej').slice(0,3);
    const hasChosen=sug.length&&sug[0].hasChosen;
    h+='<div class="row" style="margin-top:0"><button class="btn" data-a="open" data-date="'+k+'">Vælg ret</button><button class="btn ghost" data-a="surprise" data-date="'+k+'">Overrask mig</button></div>';
    h+='<p class="sugtitle">'+(hasChosen?'Bruger noget af det samme som resten':'Forslag til første ret')+'</p>'+sug.map(s=>sugRow(s,k)).join('');
  }else{
    const others=upcoming(wkOf(k)).filter(x=>x.date!==k).map(x=>dish(x.dishId));
    const U=ingSet(others);
    const shared=d.ing.map(i=>i[0]).filter(n=>U.has(n)).sort((a,b)=>WOF[b]-WOF[a]);
    h+='<div class="dishline">'+tile(d)+'<div style="min-width:0"><h4>'+d.n+'</h4>'+facts(d)+infoHtml(d)+'<span class="meta">'+famLine(d.id)+'</span>'+(shared.length?'<span class="shared">Går igen i ugen: '+shared.join(', ')+'</span>':'')+'</div></div>';
    h+='<div class="row"><button class="btn" data-a="rec" data-dish="'+d.id+'">Opskrift</button><button class="btn ghost" data-a="open" data-date="'+k+'">Skift ret</button>'+(sideItems(d.id).length?'<button class="btn ghost" data-a="sideopen" data-dish="'+d.id+'">Vælg '+sideWord(d.id)+'</button>':'')+'</div>';
    if(k<=t){h+='<div class="rate"><span class="lbl">Hvordan smagte det?</span><br>'+stars(d.id,ratingInfo(d.id).mine)+'</div>';}
  }
  return h+'</section>';
}

function viewPlan(){
  const t=todayKey(),w0=S.week,days=[];
  for(let i=0;i<7;i++)days.push(addDays(w0,i));
  const w6=days[6];
  const range=w0.getMonth()===w6.getMonth()?w0.getDate()+'.–'+w6.getDate()+'. '+MON[w6.getMonth()]:w0.getDate()+'. '+MON[w0.getMonth()]+'–'+w6.getDate()+'. '+MON[w6.getMonth()];
  let h='<div class="people"><span>Vi er</span><button class="rbtn" data-a="people" data-d="-1" aria-label="Én færre">−</button><b>'+S.people+'</b><button class="rbtn" data-a="people" data-d="1" aria-label="Én mere">+</button><span>ved bordet</span></div>';

  h+='<p class="hint">Tryk på de dage, der skal laves aftensmad.</p><div class="days">';

  days.forEach(dt=>{
    const k=dk(dt),p=S.plan[k],on=!!p,past=k<t,d=p&&p.dishId?dish(p.dishId):null;
    if(on)any=true;
    h+='<button class="day'+(on?' on':'')+(k===t?' today':'')+(past&&!on?' past':'')+'" data-a="day" data-date="'+k+'"'+(past&&!on?' disabled':'')+' aria-pressed="'+on+'" aria-label="'+longDate(k)+'"><span class="dw">'+WD[dt.getDay()]+'</span><span class="dn">'+dt.getDate()+'</span><span class="de">'+(d?d.e:(on?'+':''))+'</span></button>';
  });
  h+='</div>';
  if(!any){
    h+='<div class="empty-box"><h3>Sådan laver I en madplan</h3><ol><li>Tryk på de dage, I vil lave mad.</li><li>Vælg en ret til den første dag.</li><li>Spisetid foreslår retter med de samme ingredienser, så der bliver mindre madspild.</li><li>Åbn Indkøb for at få én samlet liste.</li></ol></div>';

    days.forEach(dt=>{const k=dk(dt);if(S.plan[k])h+=planCard(k);});
    h+='<div class="row"><button class="btn ghost" data-a="copyplan">Kopiér ugens menu</button></div>';
  }
  return h;
}

 ['Frost',/frosne|frossen|pommes|^is$|pizza|fiskepinde/],
 ['Kød & fisk',/kød|kylling|svine|okse|hakket|bøf|steg|flæsk|bacon|skinke|salami|pølse|medister|laks|torsk|rødspætte|fisk|rejer|sild|tun|makrel|leverpostej|roastbeef|hamburgerryg/],
 ['Mejeri & æg',/mælk|fløde|smør|margarine|^æg$|ost|yoghurt|skyr|cheasy|hytteost|kefir|creme fraiche|tykmælk/],
 ['Brød',/brød|rundstykke|tortilla|boller|knækbrød|toast/],
 ['Frugt & grønt',/kartof|gulerod|løg|agurk|tomat|salat|spinat|rucola|peberfrugt|broccoli|blomkål|squash|aubergine|champignon|ærter|bønner|kål|rødbed|radis|selleri|porre|persille|dild|purløg|basilikum|timian|rosmarin|ingefær|citron|lime|appelsin|æble|pære|banan|vindrue|jordbær|blåbær|hindbær|mandarin|kiwi|ananas|melon|avocado|frugt|grønt|majs/]

function catOfCustom(t){
  const n=norm(t).trim();
  if(CATOF[n])return CATOF[n];
  for(let i=0;i<CATRULES.length;i++)if(CATRULES[i][1].test(n))return CATRULES[i][0];
  return 'Kolonial';
}
function viewShopPlan(){
  const wk=dk(S.week),nav=weekNavHtml();
  const items=shopList(wk),n=upcoming(wk).length,ns=snackEntries(wk).length;
  const cust=customFor(wk).map(c=>({n:c.t,q:c.q,key:'x-'+c.id,id:c.id,custom:true,cat:catOfCustom(c.t),dishes:[]}));
  if(!items.length&&!cust.length)return nav+'<div class="empty-box"><h3>Ingen retter eller snacks i uge '+isoWeek(S.week)+'</h3><p>Vælg retter i Madplan og snacks i Snacks, så samles varerne her.</p></div>';
  const multi=items.filter(i=>i.dishes.length>1).length;
  const sum=!items.length?'':'<div class="sumbar">'+items.length+' varer til '+[n?n+(n===1?' ret':' retter'):'',ns?ns+(ns===1?' snack':' snacks'):''].filter(Boolean).join(' og ')+'<span>'+(multi?multi+(multi===1?' vare bruges':' varer bruges')+' i flere retter, så I køber ind til to på én gang.':'Vælg flere retter med de samme varer for at spare på indkøbet.')+' Mængderne passer til '+S.people+' personer.</span></div>';
  let h='';
  const btns='<div class="row"><button class="btn ghost" data-a="copy">Kopiér listen</button><button class="btn ghost" data-a="shopreset">Fjern alle flueben</button></div>';
  const openGroups=[],doneGroups=[];
  CATORDER.forEach(c=>{
    const g=items.concat(cust).filter(i=>i.cat===c).sort((a,b)=>(!!S.shop[a.key]-!!S.shop[b.key])||a.n.localeCompare(b.n,'da'));
    if(!g.length)return;
    const all=g.every(i=>!!S.shop[i.key]);
    let h='<div class="group'+(all?' alldone':'')+'"><h3>'+c+(all?' ✓':'')+'</h3>';
    g.forEach(i=>{
      const done=!!S.shop[i.key];
      if(i.custom){h+='<div class="item crow'+(done?' done':'')+'"><button class="crow-main" data-a="shop" data-key="'+i.key+'" aria-pressed="'+done+'"><span class="cb" aria-hidden="true">'+(done?'✓':'')+'</span><span class="dmain"><span class="iname">'+esc(cap(i.n))+'</span><span class="icap">Egen vare</span></span><span class="qty">'+esc(i.q)+'</span></button><button class="x sm" data-a="customdel" data-id="'+i.id+'" aria-label="Fjern '+esc(i.n)+'">✕</button></div>'+(S.confirmCustom===i.id?'<div class="confirm" role="alert"><span>Fjern '+esc(i.n)+'?</span><span class="row" style="margin:0"><button class="btn danger" data-a="customyes" data-id="'+i.id+'">Ja, fjern</button><button class="btn ghost" data-a="customno">Behold</button></span></div>':'');return;}
      h+='<button class="item'+(done?' done':'')+'" data-a="shop" data-key="'+i.key+'" aria-pressed="'+done+'"><span class="cb" aria-hidden="true">'+(done?'✓':'')+'</span><span class="dmain"><span class="iname">'+cap(i.n)+'</span><span class="icap">'+(i.dishes.length>1?'<em>Går igen</em>':'')+i.dishes.join(', ')+'</span></span><span class="qty">'+fmtQty(i.q,i.u)+'</span></button>';
    });
    h+='</div>';
    (all?doneGroups:openGroups).push(h);
  });
  return nav+openGroups.join('')+doneGroups.join('')+sum+btns;
}

function snackEntries(wk){
  const cur=dk(mondayOf(new Date())),out=[];
  Object.keys(S.snacks).sort().forEach(w=>{if(w>=cur&&(!wk||w===wk))Object.keys(S.snacks[w]).forEach(id=>{if(SBY[id])out.push(SBY[id]);});});

  for(let i=0;i<QTYRULES.length;i++)if(QTYRULES[i][0].test(n))return QTYRULES[i][1];

}

/* Når tastaturet er fremme, tilpasses søgearket til den synlige del af skærmen, så hele listen kan rulles */
function fitSheet(){
  const p=document.querySelector('.panel.tall'),v=window.visualViewport;
  if(!p||!v)return;
  if(v.height<window.innerHeight-120){p.style.top=(v.offsetTop+8)+'px';p.style.height=(v.height-16)+'px';}
  else{p.style.top='';p.style.height='';}
}
if(window.visualViewport){window.visualViewport.addEventListener('resize',fitSheet);window.visualViewport.addEventListener('scroll',fitSheet);}
function renderSheetList(){
  const box=$('#slist');if(!box||!S.sheet)return;
  const all=suggest(S.sheet),q=S.q.trim().toLowerCase();
  let h='';
  if(q){
    const f=all.filter(s=>s.d.n.toLowerCase().indexOf(q)>=0||s.d.ing.some(i=>i[0].indexOf(q)>=0));
    h=f.length?f.map(s=>sugRow(s)).join(''):'<p class="empty">Ingen retter matcher.</p>';
  }else{
    const ok=all.filter(s=>s.v!=='nej'),no=all.filter(s=>s.v==='nej');
    const hasChosen=all.length&&all[0].hasChosen;
    let top;
    if(hasChosen){top=ok.filter(s=>s.shared.length).slice(0,6);h+=top.length?'<p class="sugtitle" style="margin-top:4px">Bruger noget af det samme som resten</p>'+top.map(s=>sugRow(s)).join(''):'';}
    else{top=ok.filter(s=>s.v==='fav').slice(0,6);h+=top.length?'<p class="sugtitle" style="margin-top:4px">Familiens favoritter</p>'+top.map(s=>sugRow(s)).join(''):'<p class="hint">Vælg først en ret. Derefter foreslår Spisetid retter med de samme ingredienser.</p>';}
    const topIds=new Set(top.map(s=>s.d.id));
    const rest=ok.filter(s=>!topIds.has(s.d.id)).sort((a,b)=>a.d.n.localeCompare(b.d.n,'da'));
    h+='<p class="sugtitle">Alle retter</p>'+rest.map(s=>sugRow(s)).join('');
    if(no.length)h+='<p class="sugtitle">Ikke igen</p>'+no.map(s=>sugRow(s)).join('');
  }
  box.innerHTML=h;
}
const anySheet=()=>S.sheet||S.rec||S.backup||S.snackSheet||S.addSheet||S.sideFor||S.planFor||S.reportSheet;
function closeSheet(){S.sheet=null;S.rec=null;S.snackSheet=false;S.backup=false;S.addSheet=false;S.sideFor=null;S.planFor=null;S.reportSheet=false;S.q='';renderSheet();}
function renderSnackList(){
  const box=$('#snlist');if(!box||!S.snackSheet)return;
  const sel=S.snacks[dk(S.week)]||{};
  const rank=d=>({fav:0,ny:1,ok:1,nej:2})[verdict(d.id)];
  const list=SNACKS.slice().sort((a,b)=>rank(a)-rank(b));
  box.innerHTML=list.map(d=>{
    const on=!!sel[d.id];
    return '<button class="drow'+(on?' picked':'')+'" data-a="snacktoggle" data-id="'+d.id+'" aria-pressed="'+on+'">'+tile(d,true)+'<span class="dmain"><span class="dname">'+d.n+badge(verdict(d.id))+(on?'<span class="badge">Valgt ✓</span>':'')+'</span>'+facts(d)+(DESC[d.id]?'<span class="dmeta">'+DESC[d.id]+'</span>':'')+'<span class="dmeta">Giver ca. '+Math.round(d.y*S.people/4)+' '+d.u+(ratingInfo(d.id).n?' · '+famLine(d.id):'')+'</span></span></button>';
  }).join('');
}

/* Tilbehør vælges hver gang en ret lægges i madplanen: valget nulstilles, når retten sættes på eller tages af en dag */
function clearSides(dishId,exceptDate){
  if(!dishId||!S.sides[dishId])return;
  if(Object.keys(S.plan).some(k=>k!==exceptDate&&S.plan[k]&&S.plan[k].dishId===dishId))return;
  delete S.sides[dishId];
}
function setDay(date,dishId){clearSides(S.plan[date]&&S.plan[date].dishId,date);clearSides(dishId,date);S.plan[date]={date:date,dishId:dishId};persist(()=>db.doc('plan/'+date).set({date:date,dishId:dishId}));}
function removeDay(date){clearSides(S.plan[date]&&S.plan[date].dishId,date);delete S.plan[date];persist(()=>db.doc('plan/'+date).delete());}
function doPick(date,id){
  const others=upcoming(wkOf(date)).filter(p=>p.date!==date);
  const U=ingSet(others.map(p=>dish(p.dishId)));
  const sh=dish(id).ing.filter(i=>U.has(i[0])).length;
  setDay(date,id);
  if(S.sheet)closeSheet();
  render();
  if(others.length&&sh)toast(sh===1?'1 ingrediens går igen fra de andre retter':sh+' ingredienser går igen fra de andre retter');
}

  open(el){S.sheet=el.dataset.date;S.q='';renderSheet();},
  close(){closeSheet();},
  rec(el){S.sheet=null;S.rec=el.dataset.dish;renderSheet();},
  copyplan(){
    const l=upcoming(dk(S.week));
    if(!l.length){toast('Der er ingen retter i planen for denne uge endnu');return;}
    const t='Madplan\n'+l.map(p=>cap(longDate(p.date))+': '+dish(p.dishId).n+(S.sides[p.dishId]&&S.sides[p.dishId].length?' (med '+S.sides[p.dishId].map(shortN).join(', ')+')':'')).join('\n');
    const ok=()=>toast('Menuen er kopieret. Send den i en besked.');
    const fail=()=>toast('Kunne ikke kopiere. Prøv igen.');
    try{navigator.clipboard.writeText(t).then(ok,fail);}catch(e){fail();}
  },
  pick(el){const date=el.dataset.date||S.sheet;if(date&&el.dataset.dish)doPick(date,el.dataset.dish);},
  surprise(el){
    const s=suggest(el.dataset.date).filter(x=>x.v!=='nej').slice(0,5);
    if(s.length)doPick(el.dataset.date,s[Math.floor(Math.random()*s.length)].d.id);
  },
  star(el){
    const id=el.dataset.dish,n=Number(el.dataset.n),rid=id+'__'+me(),cur=(S.ratings[rid]||{}).stars||0,uid=me();
    if(cur===n){delete S.ratings[rid];persist(()=>db.doc('ratings/'+rid).delete());}
    else{S.ratings[rid]={dish:id,uid:uid,stars:n};persist(()=>db.doc('ratings/'+rid).set({dish:id,uid:uid,stars:n}));}
    render();
    const v=verdict(id);
    if(cur!==n)toast(v==='fav'?'Gemt. Den foreslår vi oftere.':v==='nej'?'Gemt. Den foreslår vi ikke igen.':'Gemt.');
  },
  filter(el){S.filter=el.dataset.f;render();},
  shop(el){
    const k=el.dataset.key;
    if(S.shop[k]){delete S.shop[k];persist(()=>db.doc('shop/'+k).delete());}
    else{S.shop[k]=true;persist(()=>db.doc('shop/'+k).set({checked:true}));}
    render();
  },
  shopreset(){
    const keys=Object.keys(S.shop);S.shop={};render();
    persist(async()=>{for(const k of keys)await db.doc('shop/'+k).delete();});
  },
  copy(){
    const items=shopList(dk(S.week));let t='Indkøbsliste, uge '+isoWeek(S.week)+' (til '+S.people+' personer)\n';
    const cu=customFor(dk(S.week)).filter(c=>!S.shop['x-'+c.id]).map(c=>({n:c.t,cat:catOfCustom(c.t),line:'- '+(c.q?c.q+' ':'')+c.t}));
    CATORDER.forEach(c=>{const g=items.filter(i=>i.cat===c&&!S.shop[i.key]).map(i=>'- '+fmtQty(i.q,i.u)+' '+i.n).concat(cu.filter(x=>x.cat===c).map(x=>x.line));if(g.length){t+='\n'+c+'\n'+g.join('\n')+'\n';}});
    const ok=()=>toast('Listen er kopieret');
    const fail=()=>toast('Kunne ikke kopiere. Hold fingeren på listen og markér teksten.');
    try{navigator.clipboard.writeText(t).then(ok,fail);}catch(e){fail();}
  }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el||el.disabled)return;
  const f=A[el.dataset.a];if(f)f(el);
});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='q'){S.q=e.target.value;renderSheetList();}if(e.target&&e.target.id==='addname'){if(VARER&&VARER.some(n=>norm(n)===norm(e.target.value).trim()))setQtyFor(e.target.value);const b=$('#sugg'),sv=suggestVarer(e.target.value),exact=sv.some(n=>norm(n)===norm(e.target.value).trim());if(b)b.innerHTML=(exact?[]:sv.slice(0,5)).map(n=>'<button type="button" role="option" data-a="sugpick" data-v="'+esc(n)+'" data-q="'+esc(defaultQty(n))+'"><span>'+esc(n)+'</span><small>'+esc(defaultQty(n))+'</small></button>').join('');}if(e.target&&e.target.id==='dq'){S.dq=e.target.value;const b=$('#dlist');if(b)b.innerHTML=dishCards();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&anySheet())closeSheet();});
document.addEventListener('submit',e=>{
  if(!e.target||e.target.id!=='addform')return;
  e.preventDefault();
  const t=($('#addname').value||'').trim().slice(0,60),q=($('#addqty').value||'').trim().slice(0,20);
  if(!t){toast('Skriv, hvad der skal købes');return;}
  S.custom.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:t,q:q,w:dk(S.week)});
  VARER=null;persist();render();toast('Tilføjet til listen');
});

/* ---------- Deling mellem telefoner ---------- */
function mark(){S.synced=true;S.late=false;}
function subscribe(){
  const fail=e=>{S.late=true;render();};
  db.collection('plan').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{const x=d.data()||{};o[d.id]={date:d.id,dishId:x.dishId||null};});S.plan=o;if(!snap.metadata.fromCache)mark();render();},fail);
  db.collection('ratings').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{const x=d.data()||{};o[d.id]={dish:x.dish,uid:x.uid,stars:Number(x.stars)||0};});S.ratings=o;render();},fail);
  db.collection('shop').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=true;});S.shop=o;render();},fail);
  db.doc('settings/household').onSnapshot(s=>{if(s.exists){const p=Number((s.data()||{}).people);if(p>=1&&p<=12)S.people=p;}render();},fail);
  setTimeout(()=>{if(!S.synced){S.late=true;render();}},10000);
}
function init(){
  load();
  render();
}
init();
})();
</script>
<script>if("serviceWorker"in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
